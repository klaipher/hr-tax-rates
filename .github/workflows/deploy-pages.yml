name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Без цього воркфлоу падає на репозиторії, де Pages ще не вмикали руками.
          enablement: true

      - run: pnpm install --frozen-lockfile

      # Той самий гейт, що й у CI: на main не публікується неперевірена збірка.
      - run: pnpm run check

      # Pages віддає сайт із /<repo>/, тож базовий шлях приходить від configure-pages.
      - run: pnpm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # SPA-фолбек: без цього глибокі посилання дають 404 від Pages.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
