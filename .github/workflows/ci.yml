name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Та сама команда, що й локально: типи, лінт, тести.
      - run: pnpm run check

      # Фікстури HOK згенеровані зі збережених .xlsx і закомічені. Якщо
      # перегенерація дає інший результат, вони розійшлися з джерелом —
      # і голден-тести перевіряють уже не те, що лежить у файлах палати.
      - name: Фікстури HOK відтворюються з джерела
        run: |
          pnpm run fixtures:extract
          git diff --exit-code -- packages/data/src/hok/workbooks.generated.ts

      - run: pnpm run build
